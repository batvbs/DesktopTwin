name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: 还原
        run: dotnet restore DesktopTwin.sln

      - name: 编译（Release，警告视为错误）
        run: dotnet build DesktopTwin.sln -c Release --no-restore -warnaserror

      # 用 Windows PowerShell 而不是 pwsh：脚本在 5.1 上验证过，两个引擎的正则/编码行为不完全一致。
      - name: 校验 XAML 绑定与资源键
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build/verify-xaml.ps1

      # 安全常量必须只有一处定义。这类约束编译器管不到，测试也测不出来。
      - name: 校验常量单一来源
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build/verify-invariants.ps1

      - name: 单元测试
        run: dotnet test DesktopTwin.sln -c Release --no-build --logger "console;verbosity=normal"

      # 一次产出两个版本：自带运行时的给普通用户，框架依赖的给已装 .NET 10 的机器。
      - name: 发布（自带运行时）
        run: >
          dotnet publish src/DesktopTwin/DesktopTwin.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o artifacts/publish/standalone

      - name: 发布（框架依赖）
        run: >
          dotnet publish src/DesktopTwin/DesktopTwin.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o artifacts/publish/framework

      # 发布包只给最终用户看，调试符号既没用又占体积，还会暴露源码路径。
      - name: 剔除调试符号
        run: Get-ChildItem artifacts/publish -Filter *.pdb -Recurse | Remove-Item -Force

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: DesktopTwin-win-x64
          path: artifacts/publish
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DesktopTwin-win-x64
          path: artifacts/publish

      - uses: actions/checkout@v4

      # 文件名用中文并带版本号，平铺在压缩包根目录，不套文件夹。
      # 去掉 tag 前缀的 v，和本地 build.ps1 产出的名字保持一致。
      - name: 整理为两个版本
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $stage = "stage"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item "artifacts/publish/standalone/DesktopTwin.exe" "$stage/桌面分身-$version.exe"
          Copy-Item "artifacts/publish/framework/DesktopTwin.exe" "$stage/桌面分身-$version-NET10.exe"

          $readme = (Get-Content "build/使用说明.txt" -Raw -Encoding UTF8).Replace("{{VERSION}}", $version)
          [System.IO.File]::WriteAllText(
            (Join-Path $stage "使用说明.txt"),
            $readme,
            (New-Object System.Text.UTF8Encoding($true)))

      - name: 打包
        run: Compress-Archive -Path stage/* -DestinationPath DesktopTwin-${{ github.ref_name }}-win-x64.zip

      # 用户下载后可以自行核对，避免中途被替换。
      - name: 生成校验和
        run: |
          $zip = "DesktopTwin-${{ github.ref_name }}-win-x64.zip"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          "$hash  $zip" | Out-File -FilePath SHA256SUMS.txt -Encoding utf8

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DesktopTwin-${{ github.ref_name }}-win-x64.zip
            SHA256SUMS.txt
          generate_release_notes: true
