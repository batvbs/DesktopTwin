name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: 还原
        run: dotnet restore DesktopTwin.sln

      - name: 编译（Release，警告视为错误）
        run: dotnet build DesktopTwin.sln -c Release --no-restore -warnaserror

      # 用 Windows PowerShell 而不是 pwsh：脚本在 5.1 上验证过，两个引擎的正则/编码行为不完全一致。
      - name: 校验 XAML 绑定与资源键
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build/verify-xaml.ps1

      # 安全常量必须只有一处定义。这类约束编译器管不到，测试也测不出来。
      - name: 校验常量单一来源
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build/verify-invariants.ps1

      - name: 单元测试
        run: dotnet test DesktopTwin.sln -c Release --no-build --logger "console;verbosity=normal"

      # 一次产出两个版本：自带运行时的给普通用户，框架依赖的给已装 .NET 10 的机器。
      - name: 发布（自带运行时）
        run: >
          dotnet publish src/DesktopTwin/DesktopTwin.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o artifacts/publish/standalone

      - name: 发布（框架依赖）
        run: >
          dotnet publish src/DesktopTwin/DesktopTwin.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o artifacts/publish/framework

      # 发布包只给最终用户看，调试符号既没用又占体积，还会暴露源码路径。
      - name: 剔除调试符号
        run: Get-ChildItem artifacts/publish -Filter *.pdb -Recurse | Remove-Item -Force

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: DesktopTwin-win-x64
          path: artifacts/publish
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # 必须先 checkout 再下载产物：actions/checkout 默认 clean=true，
      # 会把工作区里未跟踪的文件（包括刚下载的 artifact）一起清掉。
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: DesktopTwin-win-x64
          path: artifacts/publish

      # 文件名用中文并带版本号，和本地 build.ps1 产出的名字保持一致。
      # 三个文件直接作为 Release 附件，不再打 zip。
      - name: 准备三个文件
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $stage = "stage"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $standaloneExe = Join-Path $stage "桌面分身-$version.exe"
          $frameworkExe = Join-Path $stage "桌面分身-$version-NET10.exe"
          Copy-Item "artifacts/publish/standalone/DesktopTwin.exe" $standaloneExe
          Copy-Item "artifacts/publish/framework/DesktopTwin.exe" $frameworkExe

          # 两个 exe 名字相近，哈希要分别给出，所以写进说明文件里。
          $standaloneHash = (Get-FileHash $standaloneExe -Algorithm SHA256).Hash
          $frameworkHash = (Get-FileHash $frameworkExe -Algorithm SHA256).Hash

          $readme = (Get-Content "build/使用说明.txt" -Raw -Encoding UTF8).
            Replace("{{VERSION}}", $version).
            Replace("{{SHA256_STANDALONE}}", $standaloneHash).
            Replace("{{SHA256_FRAMEWORK}}", $frameworkHash)
          [System.IO.File]::WriteAllText(
            (Join-Path $stage "使用说明.txt"),
            $readme,
            (New-Object System.Text.UTF8Encoding($true)))

          Get-ChildItem $stage | ForEach-Object {
            "$($_.Name)  $((Get-FileHash $_.FullName -Algorithm SHA256).Hash)"
          }
      # 三个文件直接作为附件，不打 zip：用户点开就能下到要用的那一个。
      # 校验值写在 使用说明.txt 里，不再单独出 SHA256SUMS.txt。
      #
      # 用 gh CLI 而不是 action-gh-release：后者在 Windows runner 上会把
      # 附件名里的中文截掉（桌面分身-0.2.2.exe 变成 -0.2.2.exe，
      # 使用说明.txt 变成 default.txt），gh 处理 UTF-8 文件名正常。
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes --verify-tag
          $files = Get-ChildItem "stage" | Select-Object -ExpandProperty FullName
          gh release upload "${{ github.ref_name }}" $files --clobber
