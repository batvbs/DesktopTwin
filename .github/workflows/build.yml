name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: 还原
        run: dotnet restore DesktopTwin.sln

      - name: 编译（Release，警告视为错误）
        run: dotnet build DesktopTwin.sln -c Release --no-restore -warnaserror

      - name: 发布（框架依赖）
        run: >
          dotnet publish src/DesktopTwin/DesktopTwin.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -o artifacts/publish

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: DesktopTwin-win-x64
          path: artifacts/publish
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DesktopTwin-win-x64
          path: artifacts/publish

      - name: 打包
        run: Compress-Archive -Path artifacts/publish/* -DestinationPath DesktopTwin-${{ github.ref_name }}-win-x64.zip

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: DesktopTwin-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
